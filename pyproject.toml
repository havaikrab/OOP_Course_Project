[project]
name = "oop-course-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Горбунов Александр",email = "qwaeszrdxtfc1@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
lint = [
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.isort]
line_length = 119
lines_after_imports = 2

[tool.black]
line-length = 119
exclude = '''
/(
\.venv|
\.git|
\.mypy_cache|
\.pytest_cache|
build|
dist
venv
)/
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv', '.venv', '.idea']
